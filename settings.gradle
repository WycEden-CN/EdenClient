pluginManagement {
	repositories {
		// 国内镜像源（阿里云）
		maven {
			name = 'Aliyun Gradle Plugin'
			url = 'https://maven.aliyun.com/repository/gradle-plugin'
		}
		maven {
			name = 'Aliyun Public'
			url = 'https://maven.aliyun.com/repository/public'
		}
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		// 兜底官方源
		mavenCentral()
		gradlePluginPortal()
	}
}